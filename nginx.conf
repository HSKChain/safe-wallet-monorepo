server {
    listen 80;

    # 静态文件服务
    location /_next/ {
        root /usr/share/nginx/html;
        try_files $uri /_next/$uri;
    }

    # 指定 /new-safe/load 默认文件为 load.html
    location = /new-safe/load {
        root /usr/share/nginx/html;
        index load.html;
        try_files /new-safe/load.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Next 静态导出：每个路由都有独立 HTML（welcome.html 等）。
        # 必须先命中 $uri.html，否则会把首页 index.html 当兜底发给 /welcome，
        # 导致客户端再跳转的竞态白屏。最后才回退 index.html 兜底。
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}